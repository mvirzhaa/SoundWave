<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b1d">
  <meta name="robots" content="noindex, nofollow">
  <title>SoundWave Admin</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="admin-body">
  <!-- Login superadmin (terpisah dari login pengguna) -->
  <section id="adminLogin" class="auth" hidden>
    <div class="auth-card">
      <div class="auth-logo admin-logo"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg></div>
      <h1>Sound<span>Wave</span> <small class="admin-tag">Admin</small></h1>
      <p class="auth-sub">Panel superadmin. Halaman ini terpisah dari login pengguna — akun pengguna biasa tidak bisa masuk di sini.</p>
      <form id="adminForm" novalidate>
        <label class="field"><span>Email admin</span>
          <input name="email" type="email" autocomplete="username" required maxlength="160"></label>
        <label class="field"><span>Kata sandi</span>
          <input name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
        <p class="err" id="adminErr" hidden></p>
        <button class="btn-primary wide" type="submit" id="adminSubmit">Masuk sebagai admin</button>
      </form>
      <p class="hint center"><a href="./">← Ke SoundWave (pengguna)</a></p>
    </div>
  </section>

  <!-- Panel -->
  <div id="adminApp" class="app" hidden>
    <header class="topbar">
      <a class="brand" href="#ringkasan" aria-label="SoundWave Admin">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="13" width="3" height="6" rx="1.5"/><rect x="7.5" y="8" width="3" height="16" rx="1.5"/><rect x="13" y="3" width="3" height="26" rx="1.5"/><rect x="18.5" y="9" width="3" height="14" rx="1.5"/><rect x="24" y="12" width="3" height="8" rx="1.5"/></svg>
        <span>SoundWave <small class="admin-tag">Admin</small></span>
      </a>
      <nav class="mainnav" aria-label="Menu admin">
        <a href="#ringkasan" data-nav="ringkasan"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-4H4z"/></svg><span>Ringkasan</span></a>
        <a href="#pengguna" data-nav="pengguna"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 11a3 3 0 1 0 0-6M22 21a6 6 0 0 0-4-5.6"/></svg><span>Pengguna</span></a>
        <a href="#adzan" data-nav="adzan"><svg viewBox="0 0 24 24"><path d="M12 3c3 2 5 4.5 5 8H7c0-3.5 2-6 5-8zM5 11h14v10H5zM10 21v-4a2 2 0 0 1 4 0v4"/></svg><span>Adzan</span></a>
        <a href="#lirik" data-nav="lirik"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h10M4 14h12M4 18h7M18 13v6a2 2 0 1 1-2-2h2"/></svg><span>Lirik</span></a>
        <a href="#pengumuman" data-nav="pengumuman"><svg viewBox="0 0 24 24"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg><span>Pengumuman</span></a>
        <a href="#akun" data-nav="akun"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/></svg><span>Admin</span></a>
      </nav>
    </header>
    <main id="adminView" class="view" tabindex="-1"></main>
  </div>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
