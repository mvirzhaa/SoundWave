# Membuat installer & versi portable Windows otomatis di GitHub (Actions → Build Windows → Artifacts).
name: Build Windows
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: SoundWave-Windows
          path: |
            dist/SoundWave-Setup-*.exe
            dist/SoundWave-Portable-*.exe
