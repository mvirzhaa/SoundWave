# Membuat installer & versi portable Windows otomatis di GitHub (Actions → Build Windows Desktop → Artifacts).
name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    paths:
      - 'soundwave-desktop/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: soundwave-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: SoundWave-Windows
          path: |
            soundwave-desktop/dist/SoundWave-Setup-*.exe
            soundwave-desktop/dist/SoundWave-Portable-*.exe
