name: Build Mobile Android Release APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'soundwave-mobile/**'
      - '.github/workflows/build-mobile.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'soundwave-mobile/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target ARM Architecture (default: arm64-v8a,armeabi-v7a)'
        required: false
        default: 'arm64-v8a,armeabi-v7a'
        type: choice
        options:
          - 'arm64-v8a,armeabi-v7a'
          - 'arm64-v8a'
          - 'armeabi-v7a'

jobs:
  build-android:
    name: Build Android ARM Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: soundwave-mobile

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: soundwave-mobile/package-lock.json

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://vr.ti.fts.uika-bogor.ac.id/soundwave' }}

      - name: 🔑 Configure Release Keystore & ARM Architecture
        run: |
          TARGET_ARCH="${{ inputs.arch || 'arm64-v8a,armeabi-v7a' }}"
          echo "Target Architectures: $TARGET_ARCH"
          
          # Batasi arsitektur native hanya untuk ARM (tanpa x86/x86_64 emulator)
          echo "reactNativeArchitectures=$TARGET_ARCH" >> android/gradle.properties
          
          # Siapkan keystore release
          KEYSTORE_FILE="android/app/release.keystore"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Menggunakan release keystore dari GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
          else
            echo "Membuat release keystore otomatis..."
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias soundwave \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass soundwave123 -keypass soundwave123 \
              -dname "CN=SoundWave, OU=TI FTS UIKA, O=UIKA Bogor, L=Bogor, ST=Jawa Barat, C=ID"
          fi

          # Konfigurasi signingConfigs.release di android/app/build.gradle
          python3 - << 'EOF'
          import re
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          signing_block = """
                  release {
                      storeFile file('release.keystore')
                      storePassword 'soundwave123'
                      keyAlias 'soundwave'
                      keyPassword 'soundwave123'
                  }
          """
          if "signingConfigs {" in content and "release {" not in content:
              content = content.replace("signingConfigs {", "signingConfigs {" + signing_block)

          # Arahkan buildTypes.release untuk memakai signingConfigs.release
          content = re.sub(
              r'(buildTypes\s*\{\s*release\s*\{[^}]*?)signingConfig\s+signingConfigs\.debug',
              r'\1signingConfig signingConfigs.release',
              content,
              flags=re.DOTALL
          )
          if "signingConfig signingConfigs.release" not in content:
              content = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  content
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: 🔨 Build Release APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures="${{ inputs.arch || 'arm64-v8a,armeabi-v7a' }}"

      - name: 📦 Collect APK Artifacts
        run: |
          mkdir -p ../dist-apk
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} ../dist-apk/ \;
          echo "Hasil build APK:"
          ls -la ../dist-apk/

      - name: 🚀 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundwave-mobile-arm-release
          path: dist-apk/*.apk
          retention-days: 30

