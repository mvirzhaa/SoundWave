name: Build Mobile Android Release APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'soundwave-mobile/**'
      - '.github/workflows/build-mobile.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'soundwave-mobile/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target ARM Architecture'
        required: false
        default: 'arm64-v8a,armeabi-v7a'
        type: choice
        options:
          - 'arm64-v8a,armeabi-v7a'
          - 'arm64-v8a'
          - 'armeabi-v7a'

jobs:
  build-android:
    name: Build Android ARM Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: soundwave-mobile

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: soundwave-mobile/package-lock.json

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://vr.ti.fts.uika-bogor.ac.id/soundwave' }}

      - name: 🛠️ Configure Gradle & ARM Architecture
        run: |
          TARGET_ARCH="${{ inputs.arch || 'arm64-v8a,armeabi-v7a' }}"
          echo "Target Architectures: $TARGET_ARCH"
          
          # Batasi arsitektur native hanya untuk ARM (tanpa x86/x86_64 emulator)
          echo "reactNativeArchitectures=$TARGET_ARCH" >> android/gradle.properties
          
          # Alokasikan RAM yang cukup untuk kompilasi C++ React Native
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: 🔨 Build Release APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures="${{ inputs.arch || 'arm64-v8a,armeabi-v7a' }}"

      - name: 🔑 Sign Release APK
        run: |
          mkdir -p ../dist-apk
          KEYSTORE_FILE="release.keystore"
          
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Menggunakan release keystore dari GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            KS_PASS="${{ secrets.KEYSTORE_PASSWORD || 'soundwave123' }}"
            KEY_ALIAS="${{ secrets.KEY_ALIAS || 'soundwave' }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD || 'soundwave123' }}"
          else
            echo "Membuat release keystore otomatis..."
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias soundwave \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass soundwave123 -keypass soundwave123 \
              -dname "CN=SoundWave, OU=TI FTS UIKA, O=UIKA Bogor, L=Bogor, ST=Jawa Barat, C=ID"
            KS_PASS="soundwave123"
            KEY_ALIAS="soundwave"
            KEY_PASS="soundwave123"
          fi

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Menggunakan build-tools: $BUILD_TOOLS_DIR"

          for apk in $(find android/app/build/outputs/apk/release -name "*.apk"); do
            echo "Memeriksa APK: $apk"
            APK_NAME=$(basename "$apk")
            SIGNED_APK="../dist-apk/${APK_NAME/-unsigned/}"
            
            # Sign APK dengan apksigner
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-pass "pass:$KS_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$SIGNED_APK" \
              "$apk"
              
            echo "Verifikasi signature: $SIGNED_APK"
            "$BUILD_TOOLS_DIR/apksigner" verify "$SIGNED_APK"
          done

          echo "APK yang siap diunduh:"
          ls -la ../dist-apk/

      - name: 🚀 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundwave-mobile-arm-release
          path: dist-apk/*.apk
          retention-days: 30
